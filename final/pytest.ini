[pytest]
addopts =
    --testdir=./tests 
    --testMatch=**/*demo_ai*.js 
    --timeout=300000 
    --retries=1 
    --workers=1 
    --fullyParallel=false 
    --project={name: 'Chrome', use: { devices: ['Desktop Chrome'], headless: false, viewport: { width: 1280, height: 720 }, ignoreHTTPSErrors: true, video: 'retain-on-failure', screenshot: 'only-on-failure', trace: 'on-first-retry', baseURL: 'https://blazedemo.com' }}
    --project={name: 'Firefox', use: { devices: ['Desktop Firefox'], headless: true, viewport: { width: 1280, height: 720 }, ignoreHTTPSErrors: true, video: 'retain-on-failure', screenshot: 'only-on-failure', trace: 'on-first-retry', baseURL: 'https://blazedemo.com' }}
    --project={name: 'Edge', use: { devices: ['msedge'], headless: true, viewport: { width: 1280, height: 720 }, ignoreHTTPSErrors: true, video: 'retain-on-failure', screenshot: 'only-on-failure', trace: 'on-first-retry', baseURL: 'https://blazedemo.com' }}
    --project={name: 'Android', use: { devices: ['Pixel 5'], headless: false, ignoreHTTPSErrors: true, video: 'retain-on-failure', screenshot: 'only-on-failure', trace: 'on-first-retry', baseURL: 'https://blazedemo.com' }}
    --project={name: 'iPhone', use: { devices: ['iPhone 12'], headless: false, ignoreHTTPSErrors: true, video: 'retain-on-failure', screenshot: 'only-on-failure', trace: 'on-first-retry', baseURL: 'https://blazedemo.com' }}
    --reporter={list}
    --reporter={html: { outputFolder: 'reports/html' }}
    --reporter={json: { outputFile: 'reports/test-results.json' }}
    --reporter={junit: {  outputFile: 'reports/results.xml' }}
    --forbidOnly
    --preserveOutput=always
